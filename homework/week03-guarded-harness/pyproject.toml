[project]
name = "week03-guarded-harness"
version = "0.1.0"
description = "Recoverable guarded repository tasks using smolagents ToolCallingAgent"
requires-python = ">=3.12"
dependencies = [
  "smolagents==1.26.0",
  "pydantic>=2.9,<3",
  "openai>=1.99,<3",
  "python-dotenv>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "uv>=0.8,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
